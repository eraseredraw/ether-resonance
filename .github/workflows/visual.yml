name: Visual regression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Render golden frame (software WebGL)
        run: node scripts/golden.mjs

      - name: Upload rendered frame and diff
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: golden-frame
          path: |
            tests/actual.png
            tests/diff.png
          if-no-files-found: ignore

      - name: Explain a failure
        if: failure()
        run: |
          echo "tests/golden.png is the committed baseline, rendered by SwiftShader in"
          echo "this very job (seed 1337, 200 frames, 960x540). A failing diff means the"
          echo "frame changed: open the golden-frame artifact, inspect tests/diff.png,"
          echo "and if the change is intended run: node scripts/golden.mjs --update"
