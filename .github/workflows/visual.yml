name: Visual regression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Render golden frame (software WebGL)
        run: node scripts/golden.mjs

      - name: Upload rendered frame and diff
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: golden-frame
          path: |
            tests/actual.png
            tests/diff.png
          if-no-files-found: ignore

      - name: Explain a first failure
        if: failure()
        run: |
          echo "tests/golden.png is the committed baseline. If it is missing this job"
          echo "passes and only uploads tests/actual.png — download that artifact, save"
          echo "it as tests/golden.png and commit; from then on every push is compared."
          echo "If the diff is real and intended: node scripts/golden.mjs --update"
